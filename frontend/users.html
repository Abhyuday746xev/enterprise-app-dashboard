<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enterprise Users</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="assets/style/style.css">

</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-6">

<!-- ================= HEADER ================= -->

<div class="bg-white rounded-3xl shadow-lg border p-8">

<div class="flex justify-between items-center">

<div>

<h1 class="text-4xl font-bold text-slate-800">

Enterprise Users

</h1>

<p class="text-slate-500 mt-2">

Browse every Microsoft Intune user in your organization.

</p>

</div>

<div class="flex gap-4">

<a href="index.html"
class="px-6 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 transition">

<i class="fa-solid fa-house mr-2"></i>

Dashboard

</a>

<button

id="refreshUsers"

class="px-6 py-3 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition">

<i class="fa-solid fa-rotate mr-2"></i>

Refresh

</button>

</div>

</div>

</div>

<!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style/style.css">

<!-- ================= STATISTICS ================= -->

<section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mt-8">

<div class="bg-white rounded-3xl shadow-lg border p-6">

<p class="text-slate-500">

Total Users

</p>

<h2

id="userCount"

class="text-4xl font-bold mt-3 text-blue-600">

--

</h2>

</div>

<div class="bg-white rounded-3xl shadow-lg border p-6">

<p class="text-slate-500">

Enabled Accounts

</p>

<h2

id="enabledCount"

class="text-4xl font-bold mt-3 text-green-600">

--

</h2>

</div>

<div class="bg-white rounded-3xl shadow-lg border p-6">

<p class="text-slate-500">

Disabled Accounts

</p>

<h2

id="disabledCount"

class="text-4xl font-bold mt-3 text-red-600">

--

</h2>

</div>

<div class="bg-white rounded-3xl shadow-lg border p-6">

<p class="text-slate-500">

Departments

</p>

<h2

id="departmentCount"

class="text-4xl font-bold mt-3 text-indigo-600">

--

</h2>

</div>

</section>

<!-- ================= SEARCH ================= -->

<section class="mt-8">

<div class="bg-white rounded-3xl shadow-lg border p-6">

<div class="relative">

<i class="fa-solid fa-search absolute left-5 top-4 text-slate-400"></i>

<input

id="searchInput"

type="text"

placeholder="Search users..."

class="w-full pl-12 pr-5 py-4 rounded-xl border border-slate-300 focus:border-blue-500 outline-none">

</div>

</div>

</section>

<!-- ================= USERS TABLE ================= -->

<section class="mt-8">

<div class="bg-white rounded-3xl shadow-lg border overflow-hidden">

<div class="px-8 py-6 border-b">

<h2 class="text-2xl font-bold">

User Directory

</h2>

</div>

<div class="overflow-x-auto">

<table class="w-full">

<thead>

<tr class="bg-slate-100 border-b">

<th class="p-5 text-left">User</th>

<th class="p-5 text-left">Email</th>

<th class="p-5 text-left">Status</th>

<th class="p-5 text-center">Action</th>

</tr>

</thead>

<tbody id="usersTableBody">

</tbody>

</table>

</div>

</div>

</section>

<!-- ================= USER MODAL ================= -->

<div

id="detailsModal"

class="fixed inset-0 bg-black/40 hidden justify-center items-center z-50">

<div

class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl mx-6 overflow-hidden">

<div

class="flex justify-between items-center border-b px-8 py-6">

<h2 class="text-2xl font-bold">

User Details

</h2>

<button

id="closeModal"

class="text-3xl text-slate-500 hover:text-red-500">

&times;

</button>

</div>

<div

id="modalContent"

class="p-8">

</div>

</div>

</div>

<footer class="text-center mt-12 mb-6 text-slate-500">

Enterprise Management Platform © 2026

</footer>

<script src="assets/js/users.js"></script>
<script src="assets/js/usersModal.js"></script>

</body>

</html>
